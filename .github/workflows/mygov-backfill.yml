name: MyGov Backfill - Upload All Newspapers to Drive

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  backfill-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create credentials file
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        if [ -z "$GOOGLE_CREDENTIALS" ]; then
          echo "Error: GOOGLE_CREDENTIALS secret is not set"
          exit 1
        fi
        echo "$GOOGLE_CREDENTIALS" > credentials.json

    - name: Run backfill (download all + upload to Drive)
      env:
        GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
      run: |
        if [ -z "$GOOGLE_TOKEN" ]; then
          echo "Error: GOOGLE_TOKEN secret is not set"
          exit 1
        fi
        python main.py --backfill
