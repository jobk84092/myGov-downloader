name: MyGov archive sync

on:
  schedule:
    # Run on publication day and again the following day for delayed uploads.
    - cron: "15 6 * * 2,3"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - main.py
      - test_main.py
      - requirements.txt
      - .github/workflows/mygov-downloader.yml

concurrency:
  group: mygov-archive-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            main.py
            test_main.py
            requirements.txt
            archive_manifest.json
            .github/workflows/mygov-downloader.yml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Validate Drive authentication
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_TOKEN" ] && [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "Set GOOGLE_TOKEN or a service-account GOOGLE_CREDENTIALS secret."
            exit 1
          fi

      - name: Reconcile and upload missing issues
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py --backfill

      - name: Commit updated archive manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MyGov archive manifest"
            git push
          fi
